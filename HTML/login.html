<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | SQUADUP</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/login.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-container">
      <h1 class="logo">SQUAD<span class="gold">UP</span></h1>
      <form class="login-form">
        <input type="text" placeholder="Username" required />
        <input type="password" placeholder="Password" required />
        <button type="submit" onclick="event.preventDefault(); window.location.href='index.html';">LOGIN</button>
      </form>
      <p class="note">Not a member? <a href="#">Sign up</a></p>
    </div>
  </div>
</body>
</html>
